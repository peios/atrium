# atrium — the Peios web session host (atriumd). One cargo workspace, one
# package for now; see packages.pekit/.
#
# No libpeios yet: this slice has no kernel-boundary work, so the build is
# plain cargo. When atriumd starts talking to authd and KACS the libpeios
# bootstrap from netd/resolvd's recipes comes in here.

out_dir = "out"

[build]
command = """
set -eu

SRC="$(pwd)"

for tool in cargo rustc; do
  command -v "$tool" >/dev/null || { echo "missing required atrium build tool: $tool" >&2; exit 1; }
done

cargo build --release --locked --bin atriumd --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/sbin"
install -m 0755 "$PEKIT_OUT/target/release/atriumd" "$PEKIT_OUT/usr/sbin/atriumd"

# Seeds are offered, not applied: an image opts in with [registry] autoapply.
mkdir -p "$PEKIT_OUT/usr/share/regim"
install -m 0644 "$SRC/registry.d/atriumd-service.reg" "$PEKIT_OUT/usr/share/regim/atriumd-service.reg"
"""

[build.dependencies.peipkg]
cargo = "*"
rust = "*"
gcc = "*"

[test]
command = "cargo test --workspace"

[clean]
command = "cargo clean"
