# Atrium — Peios's browser-delivered interactive session. The three native
# executables are one atomic core; independently installable applications and
# conventional debug/source artifacts are carved from the same build tree by
# packages.pekit/.

out_dir = "out"

[source_package]
name = "dev.peios.atrium-source"

[build.vendor]
command = '''
set -eu
SRC=$(pwd -P)
export CARGO_HOME=/tmp/cargo
export CARGO_NET_GIT_FETCH_WITH_CLI=true
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"
cd "$SRC"
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust" = ">= 1.98.1"
# Cargo fetches the pinned Git dependencies through the git CLI.
"com.git-scm.git"    = ">= 2.55.0"
"dev.peios.peiosutils" = "*"
"org.gnu.findutils"  = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc gcc pkg-config python3 objcopy strip readelf debugedit; do
  command -v "$tool" >/dev/null || {
    echo "atrium: missing required build tool: $tool" >&2
    exit 1
  }
done

# One source release is one Atrium product family. Refuse an externally
# supplied package version that does not exactly match every workspace crate;
# this prevents a tag/wrapper mistake from producing plausible but falsely
# versioned artifacts.
cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"atrium: workspace versions {versions!r} do not equal package version {expected!r}")
'

# A release build consumes the packaged C ABI. First-party Rust libraries and
# crates.io inputs are pinned by Cargo.lock and supplied by build.vendor; no
# sibling checkout or mutable Cargo cache is visible in this build root.
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
# A newer API-compatible libpeios SDK is valid; a different SONAME ABI is not.
pkg-config --atleast-version=0.5.0 peios || {
  echo "atrium: dev.peios.libpeios-devel >= 0.5.0 (ABI 0) is required" >&2
  exit 1
}
readelf -dW "$(pkg-config --variable=libdir peios)/libpeios.so" |
  grep -E '\(SONAME\).*\[libpeios\.so\.0\]' >/dev/null

export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
# Keep every build-machine path out of the statically linked Rust crates'
# DWARF. Atrium's own paths are rewritten and collected by debugedit below;
# dependency paths use a stable vendor prefix.
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=/usr/src/debug/dev.peios.atrium/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=/usr/src/debug/dev.peios.atrium/.build --remap-path-prefix=$SRC=/usr/src/debug/dev.peios.atrium --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=/usr/src/debug/dev.peios.atrium/vendor"
# Control-flow protection (PEI-1155). Peios' libstd is built with LLVM's CET
# instrumentation (org.rust-lang.rust); stable rustc applies it to other
# crates only under -Zcf-protection, so every crate here gets ENDBR landing
# pads and the IBT/SHSTK property survives the link. The bootstrap escape
# hatch is the one the Rust recipe itself uses for the same flag.
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"

# The complete unit suite runs from the gated test target below.
cargo build --release --locked --offline \
  --bin atriumd --bin atrium-server --bin atrium-session \
  --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/libexec/atrium"
cp "$PEKIT_OUT/target/release/atriumd" "$PEKIT_OUT/usr/sbin/atriumd"
cp "$PEKIT_OUT/target/release/atrium-server" "$PEKIT_OUT/usr/libexec/atrium/atrium-server"
cp "$PEKIT_OUT/target/release/atrium-session" "$PEKIT_OUT/usr/libexec/atrium/atrium-session"
test -x "$PEKIT_OUT/usr/sbin/atriumd"
test -x "$PEKIT_OUT/usr/libexec/atrium/atrium-server"
test -x "$PEKIT_OUT/usr/libexec/atrium/atrium-session"

# Applications are ordinary catalogue packages. Ship only the five complete
# applications; explicit placeholders are source material, not production UI.
APPS="$PEKIT_OUT/usr/share/atrium/apps"
mkdir -p "$APPS"
for id in \
  org.peios.about \
  org.peios.packages \
  org.peios.registry \
  org.peios.services \
  org.peios.terminal
do
  cp -R "$SRC/apps/$id" "$APPS/$id"
done
test ! -e "$APPS/org.peios.events"
test ! -e "$APPS/org.peios.networking"
test ! -e "$APPS/org.peios.principals"
test -n "$(find "$APPS" -type f -print -quit)"
test -z "$(grep -Ril 'placeholder.*no behaviour' "$APPS" || true)"

# Seeds are offered, not applied: the image opts in through registry autoapply.
mkdir -p "$PEKIT_OUT/usr/share/regim"
cp "$SRC/registry.d/atriumd-service.reg" "$PEKIT_OUT/usr/share/regim/atriumd-service.reg"
test -f "$PEKIT_OUT/usr/share/regim/atriumd-service.reg"

# The one program in a binary directory is the one that needs a manual; the
# two helpers under libexec are not on anyone's PATH. Compressed here without
# an extra build tool dependency, and deterministically: no name, no mtime.
python3 - "$SRC" "$PEKIT_OUT" <<'PY_MAN'
import gzip, os, pathlib, sys
source, output = map(pathlib.Path, sys.argv[1:])
data = (source / "man" / "atriumd.8").read_bytes()
target = output / "usr/share/man/man8/atriumd.8.gz"
target.parent.mkdir(parents=True, exist_ok=True)
with target.open("wb") as raw:
    with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as stream:
        stream.write(data)
os.chmod(target, 0o644)
PY_MAN
test -s "$PEKIT_OUT/usr/share/man/man8/atriumd.8.gz"

# Conventional build-ID indexed symbols and the exact sources named by their
# DWARF. Statically linked vendored crates are part of these executables, so
# their referenced sources live in Atrium's debugsource package too.
: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  elf=$1
  list="$PEKIT_OUT/.debug-$(basename "$elf")"
  debugedit -b "$SRC" -d /usr/src/debug/dev.peios.atrium -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  [ -n "$build_id" ] || {
    echo "atrium: $elf has no build ID" >&2
    exit 1
  }
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug="$PEKIT_OUT/usr/lib/debug/.build-id/$first/$rest.debug"
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug "$PEKIT_OUT/usr/sbin/atriumd"
split_debug "$PEKIT_OUT/usr/libexec/atrium/atrium-server"
split_debug "$PEKIT_OUT/usr/libexec/atrium/atrium-session"

DEBUG_ROOT="$PEKIT_OUT/usr/src/debug/dev.peios.atrium"
mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue ;; esac
  case "$rel" in
    vendor/*) origin="$PEKIT_VENDOR_OUT/$rel" ;;
    *)        origin="$SRC/$rel" ;;
  esac
  [ -f "$origin" ] || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$rel")"
  cp "$origin" "$DEBUG_ROOT/$rel"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"dev.peios.peiosutils"     = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.pkgconf.pkgconf"      = "*"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
"org.llvm.clang"           = ">= 22"
"dev.peios.libpeios-devel" = ">= 0.5.0"
"dev.peios.kernel-headers" = "*"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true
SRC=$(pwd -P)
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
# A newer API-compatible libpeios SDK is valid; a different SONAME ABI is not.
pkg-config --atleast-version=0.5.0 peios || {
  echo "atrium: dev.peios.libpeios-devel >= 0.5.0 (ABI 0) is required" >&2
  exit 1
}
readelf -dW "$(pkg-config --variable=libdir peios)/libpeios.so" |
  grep -E '\(SONAME\).*\[libpeios\.so\.0\]' >/dev/null
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
# The tests run with the same control-flow protection as build.main (PEI-1155).
export RUSTC_BOOTSTRAP=1
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Zcf-protection=full"
# Run the complete unit suite against the exact locked dependency graph. The
# jobs-client test is normally conditional; give it a disposable PSPU jobs
# endpoint so it exercises descriptor passing, pidfd completion, and stop.
# sockaddr_un paths have a fixed small bound, independent of campaign paths.
# Pin the parent to /tmp rather than a potentially long inherited TMPDIR.
FAKE_DIR=$(mktemp -d /tmp/atrium-jobs.XXXXXXXXXX)
FAKE_JOBS="$FAKE_DIR/jobs.sock"
FAKE_PID=
cleanup_fake() {
  if [ -n "$FAKE_PID" ]; then
    kill "$FAKE_PID" 2>/dev/null || true
    wait "$FAKE_PID" 2>/dev/null || true
    FAKE_PID=
  fi
  rm -rf "$FAKE_DIR"
}
trap cleanup_fake EXIT
trap 'exit 129' HUP
trap 'exit 130' INT
trap 'exit 143' TERM
python3 "$SRC/tools/dev/fake_peinit.py" "$FAKE_JOBS" >"$PEKIT_OUT/fake-peinit.log" 2>&1 &
FAKE_PID=$!
i=0
while [ ! -S "$FAKE_JOBS" ]; do
  kill -0 "$FAKE_PID" 2>/dev/null || {
    cat "$PEKIT_OUT/fake-peinit.log" >&2
    exit 1
  }
  i=$((i + 1))
  [ "$i" -lt 200 ] || {
    echo "atrium: timed out waiting for fake peinit" >&2
    exit 1
  }
  sleep 0.05
done
ATRIUM_JOBS_SOCKET="$FAKE_JOBS" \
  cargo test --release --workspace --locked --offline --target-dir "$PEKIT_OUT/target"
cleanup_fake
trap - EXIT HUP INT TERM
rm -f "$PEKIT_OUT/fake-peinit.log"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
APPS="$PEKIT_OUT/usr/share/atrium/apps"

# The staged manual must be the source text, compressed reproducibly.
python3 - "$SRC" "$PEKIT_OUT" <<'PY_MAN'
import gzip, pathlib, sys
source, output = map(pathlib.Path, sys.argv[1:])
original = (source / "man" / "atriumd.8").read_bytes()
staged = output / "usr/share/man/man8/atriumd.8.gz"
assert gzip.decompress(staged.read_bytes()) == original, "staged manual differs from source"
assert original.startswith(b'.TH ATRIUMD 8 '), "manual has no section 8 title line"
# No stored name and no timestamp, so two builds of one source agree byte for byte.
header = staged.read_bytes()[:8]
assert not header[3] & 0x08, "manual gzip stores a filename"
assert header[4:8] == b"\0\0\0\0", "manual gzip stores a timestamp"
PY_MAN

# Fail closed on the properties expected from the distribution Rust policy.
for elf in \
  "$PEKIT_OUT/usr/sbin/atriumd" \
  "$PEKIT_OUT/usr/libexec/atrium/atrium-server" \
  "$PEKIT_OUT/usr/libexec/atrium/atrium-session"
do
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  readelf -dW "$elf" | grep -q 'RELR'
  if readelf -dW "$elf" | grep -E '(RPATH|RUNPATH)' >/dev/null; then
    echo "atrium: $elf carries an RPATH or RUNPATH" >&2
    exit 1
  fi
  if readelf -SW "$elf" | grep '\.debug_info' >/dev/null; then
    echo "atrium: $elf still contains unsplit debug information" >&2
    exit 1
  fi

  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug="$PEKIT_OUT/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug"
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    if grep -aF "$forbidden" "$elf" "$debug" >/dev/null; then
      echo "atrium: build path $forbidden leaked into $elf or its debug file" >&2
      exit 1
    fi
  done
done

# Exercise the staged server/session boundary, authentication relay, cookie,
# catalogue, application assets, traversal rejection, and logout. This is the
# meaningful installed-payload gate available on a non-Peios build host.
python3 "$SRC/tools/package-smoke.py" \
  --server "$PEKIT_OUT/usr/libexec/atrium/atrium-server" \
  --session "$PEKIT_OUT/usr/libexec/atrium/atrium-session" \
  --apps "$APPS"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"dev.peios.peiosutils"     = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.pkgconf.pkgconf"      = "*"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
"org.llvm.clang"           = ">= 22"
"dev.peios.libpeios-devel" = ">= 0.5.0"
"dev.peios.kernel-headers" = "*"
