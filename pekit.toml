# atrium — the Peios web session host: atriumd (SYSTEM), atrium-server
# (unprivileged, spawned by atriumd) and atrium-session (one per logon, as
# the user). One cargo workspace, one package; see packages.pekit/.
#
# The libpeios bootstrap mirrors netd's and resolvd's: pkg-config rather than
# PEIOS_LIB_DIR, and a synthesized peios.pc from the sibling trees when
# libpeios-devel is not installed in the build root. libauthd is a path
# dependency on the sibling authd tree (the PGSS Logon codec), as login's is.

out_dir = "out"

[build]
command = """
set -eu
set -o pipefail 2>/dev/null || true

SRC="$(pwd)"
REPO_ROOT="$(cd "$SRC/.." && pwd)"

for tool in cargo rustc gcc pkg-config; do
  command -v "$tool" >/dev/null || { echo "missing required atrium build tool: $tool" >&2; exit 1; }
done

unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI

if ! pkg-config --exists peios; then
  LIBPEIOS_ROOT="$REPO_ROOT/libpeios"
  PKM_UAPI_ROOT="$REPO_ROOT/pkm/out/build/headers/usr/include"
  [ -f "$LIBPEIOS_ROOT/Cargo.toml" ] || { echo "libpeios not found at $LIBPEIOS_ROOT" >&2; exit 1; }
  [ -d "$LIBPEIOS_ROOT/include/peios" ] || { echo "libpeios headers not found" >&2; exit 1; }
  [ -d "$PKM_UAPI_ROOT/pkm" ] || { echo "pkm UAPI headers not found at $PKM_UAPI_ROOT" >&2; exit 1; }
  cargo build --release --locked --manifest-path "$LIBPEIOS_ROOT/Cargo.toml"
  PC_DIR="$PEKIT_OUT/pkgconfig"
  mkdir -p "$PC_DIR"
  LIBPEIOS_VERSION="$(sed -n 's/^version = "\\([^"]*\\)".*/\\1/p' "$LIBPEIOS_ROOT/Cargo.toml" | head -1)"
  {
    printf 'prefix=%s\\n' "$LIBPEIOS_ROOT"
    printf 'exec_prefix=${prefix}\\n'
    printf 'libdir=%s/target/release\\n' "$LIBPEIOS_ROOT"
    printf 'includedir=%s/include\\n' "$LIBPEIOS_ROOT"
    printf '\\n'
    printf 'Name: peios\\n'
    printf 'Description: Peios userspace C ABI library (libpeios)\\n'
    printf 'Version: %s\\n' "$LIBPEIOS_VERSION"
    printf 'Libs: -L${libdir} -lpeios\\n'
    printf 'Cflags: -I${includedir} -I%s\\n' "$PKM_UAPI_ROOT"
  } > "$PC_DIR/peios.pc"
  export PKG_CONFIG_PATH="$PC_DIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
fi

export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo build --release --locked --bin atriumd --bin atrium-server --bin atrium-session --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/libexec/atrium"
install -m 0755 "$PEKIT_OUT/target/release/atriumd" "$PEKIT_OUT/usr/sbin/atriumd"
# Machine-facing, spawned by atriumd only: libexec, not on PATH.
install -m 0755 "$PEKIT_OUT/target/release/atrium-server" "$PEKIT_OUT/usr/libexec/atrium/atrium-server"
install -m 0755 "$PEKIT_OUT/target/release/atrium-session" "$PEKIT_OUT/usr/libexec/atrium/atrium-session"

# The first-party apps: one directory per app under the catalogue root
# atrium-session scans. Placeholders until each grows behaviour.
mkdir -p "$PEKIT_OUT/usr/share/atrium/apps"
cp -R "$SRC/apps/." "$PEKIT_OUT/usr/share/atrium/apps/"
find "$PEKIT_OUT/usr/share/atrium/apps" -type f -exec chmod 0644 {} +
find "$PEKIT_OUT/usr/share/atrium/apps" -type d -exec chmod 0755 {} +

# Seeds are offered, not applied: an image opts in with [registry] autoapply.
mkdir -p "$PEKIT_OUT/usr/share/regim"
install -m 0644 "$SRC/registry.d/atriumd-service.reg" "$PEKIT_OUT/usr/share/regim/atriumd-service.reg"
"""

[build.dependencies.peipkg]
cargo = "*"
rust = "*"
gcc = "*"
pkgconf-pkg-config = "*"
libpeios-devel = "*"
kernel-headers = "*"

[test]
command = "cargo test --workspace"

[clean]
command = "cargo clean"
