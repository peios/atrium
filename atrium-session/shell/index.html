<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrium</title>
<link rel="stylesheet" href="/shell/shell.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="left">
      <span class="brand"><span class="mark"></span>Atrium</span>
      <span class="crumbs"><span class="dot"></span><span id="hostname">peios</span><span class="chev">›</span><span id="username">…</span></span>
    </div>
    <div class="right">
      <div class="search"><span class="glyph">⌕</span><span class="hint">Search or try <code>"Restart resolvd"</code></span><kbd>⌘ K</kbd></div>
      <button class="icon" id="theme" title="Theme">◐</button>
      <button class="icon" title="Notifications">🔔</button>
      <button class="icon" title="Settings">⚙</button>
      <button class="avatar" id="avatar" aria-haspopup="menu" aria-expanded="false">··</button>
      <div class="menu" id="profile-menu" role="menu" hidden>
        <div class="menu-head">
          <div class="menu-name" id="menu-name">…</div>
          <div class="menu-sub" id="menu-user">…</div>
        </div>
        <dl class="menu-facts">
          <dt>Machine</dt><dd id="menu-host">…</dd>
          <dt>Logon session</dt><dd id="menu-session">…</dd>
          <dt>SID</dt><dd id="menu-sid">…</dd>
        </dl>
        <form method="post" action="/api/logout"><button class="menu-item danger" role="menuitem">Log out</button></form>
      </div>
    </div>
  </header>

  <nav id="dock">
    <button class="dock-item active" title="Toolbox"><span class="tile grid"></span></button>
    <div class="dock-group" id="pinned"></div>
  </nav>

  <main id="workspace">
    <section class="pane">
      <div class="toolbox">
        <div class="toolbox-head">
          <div>
            <h1>Toolbox</h1>
            <p class="sub" id="toolbox-sub">No apps installed</p>
          </div>
          <div class="seg"><button class="on">▦ Grid</button><button>☰ Browse</button></div>
        </div>
        <label class="toolbox-search"><span class="glyph">⌕</span><input id="filter" type="search" placeholder="What do you need? Try &quot;dns&quot;, &quot;services&quot;, &quot;terminal&quot;…" autocomplete="off"></label>
        <div class="chips"><span class="chip" id="chip-pinned">◇ Pinned · 0</span><span class="count" id="shown">0 shown</span></div>
      </div>
      <div id="apps"></div>
    </section>
    <div class="divider"></div>
    <section class="pane empty"></section>
  </main>
</div>
<script type="module" src="/shell/shell.js"></script>
</body>
</html>
