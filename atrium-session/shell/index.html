<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrium</title>
<link rel="stylesheet" href="/shell/shell.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="left">
      <span class="brand"><span class="mark"></span>Atrium</span>
      <span class="crumbs"><span class="dot"></span><span id="hostname">peios</span><span class="chev">›</span><span id="username">…</span></span>
    </div>
    <div class="right">
      <div class="search"><span class="glyph">⌕</span><span class="hint">Search or try <code>"Restart resolvd"</code></span><kbd>⌘ K</kbd></div>
      <button class="icon" title="Theme">◐</button>
      <button class="icon" title="Notifications">🔔</button>
      <button class="icon" title="Settings">⚙</button>
      <span class="avatar" id="avatar">··</span>
    </div>
  </header>

  <nav id="dock">
    <button class="dock-item active" title="Toolbox"><span class="tile grid"></span></button>
    <div class="dock-group">
      <button class="dock-item" title="Dashboard"><span class="tile c1"></span></button>
      <button class="dock-item" title="Events"><span class="tile c2"></span></button>
      <button class="dock-item" title="Terminal"><span class="tile c3"></span></button>
    </div>
    <div class="dock-group">
      <button class="dock-item" title="Principals"><span class="tile c4"></span></button>
      <button class="dock-item" title="Policies"><span class="tile c4"></span></button>
    </div>
    <div class="dock-group">
      <button class="dock-item" title="Networking"><span class="tile c5"></span></button>
      <button class="dock-item" title="Storage"><span class="tile c6"></span></button>
      <button class="dock-item" title="Services"><span class="tile c6"></span></button>
    </div>
  </nav>

  <main id="workspace">
    <section class="pane">
      <div class="toolbox">
        <div class="toolbox-head">
          <div>
            <h1>Toolbox</h1>
            <p class="sub">0 applets across 0 applications · right-click any applet to pin it to the sidebar</p>
          </div>
          <div class="seg"><button class="on">▦ Grid</button><button>☰ Browse</button></div>
        </div>
        <div class="toolbox-search"><span class="glyph">⌕</span><span class="hint">What do you need? Try "dns", "backup", "tailscale acl"…</span></div>
        <div class="chips"><span class="chip">◇ Pinned · 0</span><span class="chip">⊙ Debug</span><span class="count">0 shown</span></div>
      </div>
      <div id="apps"></div>
    </section>
    <div class="divider"></div>
    <section class="pane empty"></section>
  </main>
</div>
<script type="module" src="/shell/shell.js"></script>
</body>
</html>
