[package]
name = "atrium-session"
description = "One interactive Atrium session, running as the user."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atrium-session"
path = "src/main.rs"

[dependencies]
atrium-http = { path = "../atrium-http" }
atrium-proto = { path = "../atrium-proto" }
peios = { workspace = true }
serde = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
# The websocket accept key (RFC 6455 §4.2.2). Pure computation; authd and
# peinit carry the same dependency.
sha1 = "0.10"
# App manifests. Pure parsing, no I/O.
toml = "0.9"
