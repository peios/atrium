# Atrium's three executables are separate security roles, not separate
# products. atriumd cannot provide a supported service without the server and
# session helpers, and neither helper has a standalone lifecycle, so they must
# upgrade atomically in one package.

[package]
name        = "dev.peios.atrium-core"
description = "Peios web session host runtime"
# The crate closure the three executables link; build.main's
# collect-rust-licences --check holds this to what those crates declare.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
# atriumd is a PGSS Logon client and submits each interactive session as a
# peinit job. Its service definition also orders itself after lpsd so prompts
# have a local principal source that can answer them.
"dev.peios.authd"  = "*"
"dev.peios.authd-lpsd"   = "*"
"dev.peios.peinit" = "*"

[files]
"@source:LICENSE"                              = "usr/share/licenses/dev.peios.atrium-core/LICENSE"
":licenses/**"                                 = "usr/share/licenses/dev.peios.atrium-core/third-party"
":usr/sbin/atriumd"                            = "usr/sbin/atriumd"
":usr/libexec/atrium/atrium-server"            = "usr/libexec/atrium/atrium-server"
":usr/libexec/atrium/atrium-session"           = "usr/libexec/atrium/atrium-session"
":usr/share/regim/atriumd-service.reg"         = "usr/share/regim/atriumd-service.reg"
":usr/share/man/man8/atriumd.8.gz"             = "usr/share/man/man8/atriumd.8.gz"
