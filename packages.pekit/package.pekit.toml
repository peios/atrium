# Base metadata for the packages carved from the Atrium build tree. Atrium is
# a product family: an installable default-product meta package, the
# architecture-specific core, independently installable noarch applications,
# and the conventional debug/source artifacts.

format = "peipkg"

[package]
version      = "{{version}}-2"
architecture = "x86_64"
license      = "MIT"
license_class = "free"
