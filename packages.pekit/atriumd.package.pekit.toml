# atriumd — the Peios web session host, with atrium-server (the unprivileged
# network-facing half it spawns) and atrium-session (one per logon, as the
# user). One package: they are one program split for privilege, versioned
# and shipped together.
#
# Runtime library dependencies (libpeios, glibc) are derived from the
# binaries' DT_NEEDED entries.

[package]
description = "Peios web session host - the browser-delivered session, on port 8080"

[files]
":usr/sbin/atriumd" = "usr/sbin/atriumd"
":usr/libexec/atrium/atrium-server" = "usr/libexec/atrium/atrium-server"
":usr/libexec/atrium/atrium-session" = "usr/libexec/atrium/atrium-session"
# The service definition. Inert until an image names it in [registry] autoapply.
":usr/share/regim/atriumd-service.reg" = "usr/share/regim/atriumd-service.reg"
