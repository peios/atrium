<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services</title>
<link rel="stylesheet" href="/shell/tokens.css">
<style>
  body { min-height: 100vh; }
  main { max-width: 62rem; margin: 0 auto; padding: clamp(20px, 4vh, 40px) 24px 48px; }

  /* Page head */
  .page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
             text-transform: uppercase; color: var(--c-text-3); }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 6px 0 0; }
  .actions { display: flex; gap: 8px; align-items: center; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--c-border-2); background: var(--c-surface); color: var(--c-text);
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--c-surface-2); border-color: var(--c-text-3); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  [hidden] { display: none !important; }
  .btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: white; }
  .btn.primary:hover { filter: brightness(1.05); background: var(--c-accent); }
  .btn.primary:disabled { filter: none; }
  .btn.sm { padding: 4px 12px; font-size: 12px; }
  .btn.danger:hover { border-color: color-mix(in oklab, var(--c-err) 45%, transparent); color: var(--c-err); }

  /* Banner */
  .banner {
    border: 1px solid color-mix(in oklab, var(--c-err) 40%, transparent);
    background: color-mix(in oklab, var(--c-err) 7%, var(--c-surface));
    color: var(--c-text); border-radius: var(--radius); padding: 12px 14px;
    font-size: 13px; margin-bottom: 14px;
  }
  .banner[hidden] { display: none; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tb-search {
    flex: 1 1 200px; display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; background: var(--c-surface);
    border: 1px solid var(--c-border); border-radius: 999px; color: var(--c-text-2);
  }
  .tb-search svg { flex: none; }
  .tb-search input { flex: 1; min-width: 0; border: none; background: none; outline: none;
                     font: inherit; font-size: 13px; color: var(--c-text); }
  .pill {
    font: inherit; font-size: 12.5px; cursor: pointer;
    padding: 6px 14px; border: 1px solid var(--c-border); border-radius: 999px;
    color: var(--c-text-2); background: var(--c-surface);
  }
  .pill:hover { background: var(--c-surface-2); }
  .pill.active { background: var(--c-text); color: var(--c-bg); border-color: var(--c-text); }
  .pill .n { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; margin-left: 4px; }

  /* Card + table */
  .card { background: var(--c-surface); border: 1px solid var(--c-border);
          border-radius: var(--radius-lg); box-shadow: var(--shadow-1); overflow: hidden; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--dens-fs); }
  th { text-align: left; font-weight: 500; font-size: 11px;
       letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-text-3);
       padding: 11px 14px; border-bottom: 1px solid var(--c-border); }
  th:first-child, td:first-child { padding-left: 20px; }
  th:last-child, td:last-child { padding-right: 20px; text-align: right; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--c-border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--c-surface-2); }
  tbody tr.sel td { background: var(--c-accent-2); }
  .name { font-weight: 550; font-size: 13.5px; }
  .name.mono { font-family: var(--font-mono); font-size: 13px; }
  .sub-ln { font-size: 12px; color: var(--c-text-3); margin-top: 2px; }
  .sub-ln .id { font-family: var(--font-mono); font-size: 11px; }
  .mono { font-family: var(--font-mono); font-size: 12px; color: var(--c-text-2); }
  .empty { padding: 28px 16px; text-align: center; color: var(--c-text-3); font-size: 13px; }

  /* Status badges */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 500; font-family: var(--font-mono);
    padding: 2px 10px; border-radius: 999px; width: max-content;
  }
  .badge .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok    { background: color-mix(in oklab, var(--c-ok) 14%, transparent); color: var(--c-ok); }
  .badge.info  { background: color-mix(in oklab, var(--c-info) 14%, transparent); color: var(--c-info); }
  .badge.info .d { animation: pulse 1.2s ease-in-out infinite; }
  .badge.err   { background: color-mix(in oklab, var(--c-err) 14%, transparent); color: var(--c-err); }
  .badge.muted { background: var(--c-surface-2); color: var(--c-text-3); }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* Detail */
  #detail { margin-top: 16px; padding: 18px 20px; }
  #detail[hidden] { display: none; }
  .dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
  .dhead h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .dhead .id { font-family: var(--font-mono); font-size: 11.5px; color: var(--c-text-3); }
  .removed { color: var(--c-warn); font-weight: 550; font-size: 12.5px; }
  .ddesc { color: var(--c-text-2); font-size: 13px; margin: 4px 0 14px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 18px;
       margin: 10px 0 16px; font-size: 12.5px; }
  dt { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3);
       text-transform: uppercase; letter-spacing: 0.06em; align-self: baseline; padding-top: 1px; }
  dd { margin: 0; color: var(--c-text); overflow-wrap: anywhere; }
  .warns { margin: 0 0 14px; padding-left: 18px; font-size: 12.5px; color: var(--c-warn); }
  #action-err { color: var(--c-err); font-size: 12.5px; font-family: var(--font-mono); }
  #action-err[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <div class="eyebrow" id="host">services</div>
      <h1>Services</h1>
    </div>
    <div class="actions">
      <button class="btn" id="b-refresh">Refresh</button>
    </div>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div class="toolbar">
    <div class="tb-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Filter services…">
    </div>
    <button class="pill active" data-pill="all">All<span class="n" id="n-all"></span></button>
    <button class="pill" data-pill="running">Running<span class="n" id="n-running"></span></button>
    <button class="pill" data-pill="stopped">Stopped<span class="n" id="n-stopped"></span></button>
    <button class="pill" data-pill="trouble">Trouble<span class="n" id="n-trouble"></span></button>
  </div>

  <div class="card">
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Service</th><th>State</th><th>Health</th><th>Cause</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden></div>
  </div>

  <div id="detail" class="card" hidden>
    <div class="dhead">
      <h2 id="d-name"></h2>
      <span id="d-state" class="badge"></span>
      <span id="d-id" class="id"></span>
      <span id="d-removed" class="removed" hidden>definition removed</span>
    </div>
    <div id="d-desc" class="ddesc" hidden></div>
    <dl id="d-facts"></dl>
    <ul id="d-warns" class="warns" hidden></ul>
    <div class="actions">
      <button id="b-start" class="btn primary">Start</button>
      <button id="b-restart" class="btn">Restart</button>
      <button id="b-stop" class="btn danger">Stop</button>
      <button id="b-reset" class="btn" hidden>Reset</button>
      <span id="action-err" hidden></span>
    </div>
  </div>
</main>

<script type="module">
import { atrium } from '/shell/sdk.js';

const $ = (id) => document.getElementById(id);
const RUNNING = new Set(['active', 'reloading']);
const TRANSIENT = new Set(['starting', 'stopping']);
const BROKEN = new Set(['backoff', 'failed', 'abandoned']);
const STOPPED = new Set(['inactive', 'completed', 'skipped']);
const RESETTABLE = new Set(['failed', 'abandoned']);

let services = [];      // last good list
let selected = null;    // service name
let detail = null;      // last good status for selected
let busy = false;       // an action is in flight
let timer = null;
let filter = { q: '', pill: 'all' };

// ---- svctl over the exec capability --------------------------------------

// Runs svctl --json <args>, returns the parsed response object. svctl
// prints the server's raw response line even for server errors (exit 1),
// so parseable stdout wins over the exit code. Exit 69 is "could not
// connect" — the socket admits SYSTEM and administrators only.
async function svctl(...args) {
  let out = '';
  const done = await atrium.exec(['svctl', '--json', ...args],
    (text, stream) => { if (stream !== 'stderr') out += text; });
  const line = out.trim().split('\n').filter(Boolean).pop() || '';
  try { return JSON.parse(line); } catch {}
  if (done.exit_code === 69) throw new ConnectError();
  throw new Error(line || `svctl exited ${done.exit_code ?? `signal ${done.exit_signal}`}`);
}
class ConnectError extends Error {
  constructor() { super('peinit control socket unreachable'); }
}

// ---- rendering -----------------------------------------------------------

function badgeFor(state) {
  if (RUNNING.has(state)) return 'ok';
  if (TRANSIENT.has(state)) return 'info';
  if (BROKEN.has(state)) return 'err';
  return 'muted';
}

function bucket(s) {
  if (RUNNING.has(s.state) || s.state === 'starting') return 'running';
  if (BROKEN.has(s.state) || s.health === 'unhealthy') return 'trouble';
  return 'stopped';
}

function badge(state) {
  const b = document.createElement('span');
  b.className = `badge ${badgeFor(state)}`;
  const d = document.createElement('span');
  d.className = 'd';
  b.append(d, state);
  return b;
}

function matches(s) {
  const q = filter.q.trim().toLowerCase();
  if (q && ![s.service, s.display_name, s.description]
      .some((f) => f && f.toLowerCase().includes(q))) return false;
  return filter.pill === 'all' || bucket(s) === filter.pill;
}

function renderList() {
  for (const p of ['all', 'running', 'stopped', 'trouble']) {
    const n = p === 'all' ? services.length : services.filter((s) => bucket(s) === p).length;
    $(`n-${p}`).textContent = n ? `· ${n}` : '';
  }

  const shown = services.filter(matches);
  const rows = $('rows');
  rows.textContent = '';
  for (const s of shown) {
    const tr = document.createElement('tr');
    tr.className = s.service === selected ? 'sel' : '';
    tr.dataset.service = s.service;

    const name = document.createElement('td');
    const n = document.createElement('div');
    n.className = 'name' + (s.display_name ? '' : ' mono');
    n.textContent = s.display_name || s.service;
    name.appendChild(n);
    if (s.display_name || s.description) {
      const sub = document.createElement('div');
      sub.className = 'sub-ln';
      if (s.display_name) {
        const id = document.createElement('span');
        id.className = 'id';
        id.textContent = s.service;
        sub.appendChild(id);
        if (s.description) sub.append(` — ${s.description}`);
      } else {
        sub.textContent = s.description;
      }
      name.appendChild(sub);
    }

    const state = document.createElement('td');
    state.appendChild(badge(s.state));

    const health = document.createElement('td');
    if (s.health === 'unhealthy') {
      const b = document.createElement('span');
      b.className = 'badge err';
      b.textContent = 'unhealthy';
      health.appendChild(b);
    } else {
      health.className = 'mono';
      health.textContent = s.health ?? '—';
    }

    const cause = document.createElement('td');
    cause.className = 'mono';
    cause.textContent = s.cause ?? '—';

    const manage = document.createElement('td');
    const mb = document.createElement('button');
    mb.className = 'btn sm';
    mb.textContent = 'Manage';
    manage.appendChild(mb);

    tr.append(name, state, health, cause, manage);
    tr.addEventListener('click', () => select(s.service));
    rows.appendChild(tr);
  }

  const empty = $('empty');
  empty.hidden = shown.length !== 0;
  if (!shown.length) {
    empty.textContent = services.length
      ? 'Nothing matches the filter.'
      : 'No services visible. Either none are defined, or this logon may '
        + 'query none — peinit omits what you may not see.';
  }
}

function fmtUptime(secs) {
  if (secs == null) return null;
  const d = Math.floor(secs / 86400), h = Math.floor(secs / 3600) % 24,
        m = Math.floor(secs / 60) % 60, s = Math.floor(secs) % 60;
  if (d) return `${d}d ${h}h ${m}m`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}

function fact(dl, label, value, mono = false) {
  if (value == null || value === '') return;
  const dt = document.createElement('dt');
  dt.textContent = label;
  const dd = document.createElement('dd');
  if (mono) { const c = document.createElement('span'); c.className = 'mono'; c.textContent = value; dd.appendChild(c); }
  else dd.textContent = value;
  dl.append(dt, dd);
}

function renderDetail() {
  const box = $('detail');
  if (!selected || !detail) { box.hidden = true; return; }
  box.hidden = false;

  $('d-name').textContent = detail.display_name || detail.service;
  const st = $('d-state');
  st.className = `badge ${badgeFor(detail.state)}`;
  st.textContent = '';
  const d = document.createElement('span');
  d.className = 'd';
  st.append(d, detail.state);
  $('d-id').textContent = detail.display_name ? detail.service : '';
  $('d-removed').hidden = !detail.definition_removed;
  const desc = $('d-desc');
  desc.hidden = !detail.description;
  desc.textContent = detail.description || '';

  const dl = $('d-facts');
  dl.textContent = '';
  fact(dl, 'cause', detail.cause, true);
  fact(dl, 'health', detail.health, true);
  fact(dl, 'status', detail.status_text);
  fact(dl, 'uptime', fmtUptime(detail.uptime_seconds));
  if (detail.current_job) {
    fact(dl, 'pid', detail.current_job.pid, true);
    fact(dl, 'identity', detail.current_job.identity, true);
  }
  if (detail.current_operation) {
    fact(dl, 'operation', `${detail.current_operation.type} (${detail.current_operation.source})`, true);
  }

  const warns = $('d-warns');
  warns.textContent = '';
  const list = Array.isArray(detail.warnings) ? detail.warnings : [];
  for (const w of list) {
    const li = document.createElement('li');
    li.textContent = typeof w === 'string' ? w : `${w.type}: ${w.path}`;
    warns.appendChild(li);
  }
  warns.hidden = list.length === 0;

  const state = detail.state;
  $('b-start').disabled = busy || RUNNING.has(state) || TRANSIENT.has(state);
  $('b-stop').disabled = busy || STOPPED.has(state) || state === 'stopping';
  $('b-restart').disabled = busy;
  $('b-reset').hidden = !RESETTABLE.has(state);
  $('b-reset').disabled = busy;
}

function showBanner(text) { const b = $('banner'); b.textContent = text; b.hidden = false; }
function clearBanner() { $('banner').hidden = true; }

// ---- data flow -----------------------------------------------------------

let disconnected = false;

async function refresh() {
  try {
    const res = await svctl('list');
    if (res.status !== 'ok') throw new Error(`${res.code}: ${res.message}`);
    disconnected = false;
    clearBanner();
    services = (res.services || []).slice()
      .sort((a, b) => a.service.localeCompare(b.service));
    renderList();
    if (selected && !services.some((s) => s.service === selected)) {
      selected = null; detail = null;
    }
    if (selected) await refreshDetail();
    else renderDetail();
  } catch (err) {
    if (err instanceof ConnectError) {
      disconnected = true;
      showBanner('peinit refused the connection to its control socket. '
        + 'Only SYSTEM and administrators may administer services; this '
        + 'logon is not one of them, or peinit is not running.');
    } else {
      showBanner(`svctl list failed: ${err.message}`);
    }
  }
  schedule();
}

async function refreshDetail() {
  if (!selected) return;
  try {
    const res = await svctl('status', selected);
    if (res.status !== 'ok') throw new Error(`${res.code}: ${res.message}`);
    detail = res;
    renderDetail();
  } catch (err) {
    // A vanished service or a lost right: fall back to the list view.
    detail = null;
    renderDetail();
  }
}

function schedule() {
  clearTimeout(timer);
  const delay = document.hidden ? 30000 : (disconnected ? 10000 : 2500);
  timer = setTimeout(refresh, delay);
}

function refreshNow() { clearTimeout(timer); refresh(); }

async function select(name) {
  selected = name;
  renderList();
  await refreshDetail();
}

async function act(verb, ...extra) {
  if (!selected || busy) return;
  busy = true;
  $('action-err').hidden = true;
  renderDetail();
  try {
    const res = await svctl(verb, selected, ...extra);
    if (res.status === 'error') {
      const e = $('action-err');
      e.textContent = `${res.code}: ${res.message}`;
      e.hidden = false;
    }
  } catch (err) {
    const e = $('action-err');
    e.textContent = err.message;
    e.hidden = false;
  } finally {
    busy = false;
  }
  refreshNow();
}

$('b-start').addEventListener('click', () => act('start', '--wait'));
$('b-stop').addEventListener('click', () => act('stop', '--wait'));
$('b-restart').addEventListener('click', () => act('restart', '--wait'));
$('b-reset').addEventListener('click', () => act('reset'));
$('b-refresh').addEventListener('click', refreshNow);

$('q').addEventListener('input', (e) => { filter.q = e.target.value; renderList(); });
for (const p of document.querySelectorAll('.pill')) {
  p.addEventListener('click', () => {
    filter.pill = p.dataset.pill;
    for (const o of document.querySelectorAll('.pill')) o.classList.toggle('active', o === p);
    renderList();
  });
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshNow();
});
atrium.shortcuts.on('R', refreshNow);

await atrium.ready();
refresh();
atrium.request({ kind: 'system-info' })
  .then((i) => { if (i && i.hostname) $('host').textContent = `${i.hostname} / services`; })
  .catch(() => {});
</script>
</body>
</html>
