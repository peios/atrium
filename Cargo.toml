[workspace]
resolver = "2"
members = ["atrium-proto", "atrium-http", "atriumd", "atrium-server", "atrium-session"]

# atrium is its own workspace root, like netd, resolvd and authd.
#
#   atrium-proto    the control protocol between atriumd and atrium-server:
#                   message types and the length-prefixed framing. No I/O
#                   policy, no privilege.
#   atriumd         the daemon peinit starts, as SYSTEM. Originates logons
#                   with authd, holds the session table, and spawns the
#                   unprivileged server (and, once peinit's jobs API lands,
#                   asks peinit to spawn per-user session hosts).
#   atrium-http     the least HTTP/1.1 the server and session hosts need.
#   atrium-server   the network-facing half, spawned by atriumd with a
#                   privilege-stripped token. HTTP, the login page, cookies,
#                   and forwarding to session hosts.
#   atrium-session  one per logon, running as the user. Everything the user
#                   sees after login. Spawned by atriumd for now; by peinit's
#                   jobs API once that exists.

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
peios = { path = "../peios-rs/peios" }
libauthd = { path = "../authd/libauthd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
