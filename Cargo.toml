[workspace]
resolver = "2"
members = ["atrium-proto", "atrium-http", "atriumd", "atrium-server", "atrium-session"]

# atrium is its own workspace root, like netd, resolvd and authd.
#
#   atrium-proto    the control protocol between atriumd and atrium-server:
#                   message types and the length-prefixed framing. No I/O
#                   policy, no privilege.
#   atriumd         the daemon peinit starts, as SYSTEM. Originates logons
#                   with authd, holds the session table, spawns the
#                   unprivileged server, and submits per-user session hosts
#                   to peinit as jobs.
#   atrium-http     the least HTTP/1.1 the server and session hosts need.
#   atrium-server   the network-facing half, spawned by atriumd with a
#                   privilege-stripped token. HTTP, the login page, cookies,
#                   and forwarding to session hosts.
#   atrium-session  one per logon, running as the user. Everything the user
#                   sees after login. A peinit job (PSPU §7) submitted by
#                   atriumd with the logon token as its identity.

[workspace.package]
version = "0.0.28"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
# First-party Rust dependencies are pinned to immutable commits.  Release
# builds vendor the complete Cargo.lock closure before entering the offline
# Peios build root, so they never depend on sibling checkout layout or mutable
# branch state.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f4309f78fbaa878a14429a5e07d778dba9ddfab7", package = "peios" }
libauthd = { git = "https://github.com/peios/authd.git", rev = "dbade050d817e9afe4348ce4a09578b5b50f6910", package = "libauthd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
